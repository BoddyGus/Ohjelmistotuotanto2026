{% extends "layout.html" %}

{% block title %}
Add a new reference
{% endblock %}

{% block body %}

<h2>Add a new reference</h2>

<form action="/new_reference" method="post">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul role="alert">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <label for="citation_key">Citation key:</label>
  <input type="text" id="citation_key" name="citation_key" value="{{ form_data.get('citation_key', '') }}" required>
  <br>
  <label for="type">Type:</label>
  <input type="text" id="type" name="type" value="{{ form_data.get('type', '') }}" required>
  <br>
  <label for="author">Author:</label>
  <input type="text" id="author" name="author" value="{{ form_data.get('author', '') }}" required>
  <br>
  <label for="title">Title:</label>
  <input type="text" id="title" name="title" value="{{ form_data.get('title', '') }}" required>
  <br>
  <label for="year">Year:</label>
  <input type="number" id="year" name="year" value="{{ form_data.get('year', '') }}" required>
  <br>
  <label for="publication">Publication:</label>
  <input type="text" id="publication" name="publication" value="{{ form_data.get('publication', '') }}">
  <br>
  <button type="submit">
    Add book
  </button>
</form>

{% endblock %}
